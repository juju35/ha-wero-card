name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create (e.g. v1.2.0)
        required: true
      title:
        description: Release title
        required: true
      notes:
        description: Release notes (Markdown)
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A release created with GITHUB_TOKEN does not trigger release.yml, so attach the asset here.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.title }}
          body: ${{ inputs.notes }}
          files: dist/wero-card.js
